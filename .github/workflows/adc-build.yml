name: ADC migration build

on:
  push:
    branches:
      - agent/replace-nmdc-with-adc
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Fetch source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output source.tar.gz
          tar --extract --gzip --file source.tar.gz --strip-components=1
          rm source.tar.gz

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            make \
            gettext \
            libasprintf-dev \
            libcrypt-dev \
            libicu-dev \
            libmaxminddb-dev \
            default-libmysqlclient-dev \
            libpcre3-dev \
            librhash-dev \
            libssl-dev \
            zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DUSE_TLS_PROXY=OFF -DUSE_FEARTLS_PROXY=OFF

      - name: Build
        run: cmake --build build --parallel 2
